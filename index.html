<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container" class="container">
        <!-- Login Form -->
        <div id="login-box" class="auth-box">
            <h2>Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="login-username" required>
                    <label for="login-username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" required>
                    <label for="login-password">Password</label>
                </div>
                <button type="submit" class="btn">Login</button>
                <p id="login-error" class="error-message"></p>
                <p class="toggle-auth">Don't have an account? <span id="show-signup" class="toggle-link">Sign Up</span></p>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-box" class="auth-box hidden">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <input type="text" id="signup-username" required>
                    <label for="signup-username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" required>
                    <label for="signup-password">Password</label>
                </div>
                <button type="submit" class="btn">Sign Up</button>
                <p id="signup-error" class="error-message"></p>
                 <p class="toggle-auth">Already have an account? <span id="show-login" class="toggle-link">Login</span></p>
            </form>
        </div>
    </div>

    <div id="chat-container" class="container hidden">
        <div class="chat-box">
            <div class="chat-header">
                <h2>AI Chat</h2>
                <button id="logout-btn" class="btn">Logout</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <!-- Messages will be appended here -->
            </div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Type your message...">
                <button id="send-btn" class="btn">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
